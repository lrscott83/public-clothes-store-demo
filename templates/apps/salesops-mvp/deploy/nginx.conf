# Serves the salesops-mvp SPA (static, client-only). No backend: the app makes
# no API calls (react-router.config.ts -> ssr:false), so there is no /api proxy.
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing owns everything else.
    location / {
      try_files $uri /index.html;
    }
  }
}
