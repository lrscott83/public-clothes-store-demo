# nova.playground.sceiba.net — salesops-mvp static SPA (podman-compose).
# The image is built beforehand by deploy.sh (podman build) from the monorepo
# root, so this file only runs the pre-built image — same idiom as the
# store-mgmt `api` service. Host port 8090 is what HAProxy's nova_backend
# targets (127.0.0.1:8090).
services:
  nova:
    image: localhost/nova_salesops:latest
    container_name: nova_salesops
    restart: always
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
