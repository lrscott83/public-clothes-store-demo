services:
  postgres:
    image: postgres:16-alpine
    container_name: store-mgmt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: store_mgmt
      POSTGRES_PASSWORD: store_mgmt
      POSTGRES_DB: store_mgmt
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_mgmt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
